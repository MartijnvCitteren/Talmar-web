openapi: 3.1.1
info:
  title: Talmar Vacancy API
  description: >
    API for managing vacancies in Talmar. This endpoint covers creating (partially AI generated) vacancies, publishing, 
    updating and fetching vacancies.
  version: 1.0.0
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Vacancy
    description: >
      Vacancy resource lifecycle: staged creation, partial updates, status transitions, soft
      delete, and the internal owner-dashboard listing.
  - name: Generation
    description: >
      AI-assisted drafting of a vacancy description. Generation is asynchronous: start a job, then
      poll it. A draft is a suggestion only; it is never written to the vacancy automatically.

paths:
  /vacancy:
    post:
      operationId: createVacancy
      tags: [Vacancy]
      summary: Create a vacancy
      description: >
        Creates a new vacancy in `DRAFT` status from the core section only (job title, category,
        location, workplace type, hours per week). The description is added afterwards via
        `POST /vacancy/{id}/description`, contact person and offer via `PATCH /vacancy/{id}`,
        matching the staged/AI-assisted creation flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyCoreRequest'
      responses:
        '201':
          description: Vacancy created.
          headers:
            Location:
              description: URL of the newly created vacancy.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listVacancies
      tags: [Vacancy]
      summary: List vacancies (internal, authenticated)
      description: >
        Internal owner-dashboard listing across all statuses, including `DRAFT`. This endpoint is
        authenticated and must never be exposed to anonymous candidates — it is not the public job
        board. A separate `GET /public/vacancy` (implicitly filtered to `PUBLISHED`) is deferred
        until the public job board is actually built.


        Uses keyset/cursor pagination on `id` (UUIDv7, time-ordered), which scales better than
        offset pagination and is the natural fit for a time-ordered identifier.
      parameters:
        - $ref: '#/components/parameters/JobTitleFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/OpenDaysMin'
        - $ref: '#/components/parameters/OpenDaysMax'
        - $ref: '#/components/parameters/ContactPersonName'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of vacancies matching the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vacancy/{id}/description:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    post:
      operationId: manualVacancyDescription
      tags: [ Vacancy ]
      summary: User manually creates a vacancy description
      description: >
        Sets the `description` (summary, job description, tasks, what we offer, about us) for an
        existing vacancy from manually entered fields, as an alternative to the AI-assisted flow via
        `POST /vacancy/{id}/generate-description`. Replaces the vacancy's current `description` in
        full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyDescriptionRequest'
      responses:
        '201':
          description: Vacancy description saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDescriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConcurrentModification'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vacancy/{id}/generate-description:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    post:
      operationId: generateVacancyDescription
      tags: [ Generation ]
      summary: Start an AI-assisted vacancy description generation
      description: >
        Starts an asynchronous generation of a draft `description` for an existing vacancy from a
        few short inputs, the vacancy's job title and its language. Only `summary`,
        `jobDescription` and `tasks` are generated; `whatWeOffer` and `aboutUs` are not, because
        there are no facts to base them on yet. Generation runs against an external AI provider and
        is not guaranteed to complete within a single request/response cycle, so this endpoint only
        starts the job and returns a `generationId` immediately. Poll
        `GET /vacancy/{id}/generate-description/{generationId}` until `status` is `COMPLETED` or
        the poll returns a problem response. The result is a suggestion only and is never persisted
        automatically — the client shows it to the user for editing and only then submits the
        (possibly edited) result via `POST /vacancy/{id}/description`. A generated draft is kept
        for 32 hours, then deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateVacancyDescriptionRequest'
      responses:
        '202':
          description: Generation started.
          headers:
            Location:
              description: URL to poll for the generation result.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDescriptionGeneration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vacancy/{id}/generate-description/{generationId}:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
      - $ref: '#/components/parameters/GenerationId'
    get:
      operationId: getVacancyDescriptionGeneration
      tags: [Generation]
      summary: Poll the status of a description generation job
      description: >
        Returns the current status of a description-generation job started via
        `POST /vacancy/{id}/generate-description`: `200` with `status` `PENDING` while the draft
        is being generated, `200` with `status` `COMPLETED` and the draft in `description` once it
        is done. A failed generation is returned as a problem response instead of a `200`: `422`
        when the inputs were rejected as not describing a job (retrying the same inputs will not
        help, the user has to change them), `500` when the generation failed on our side or did
        not finish within 90 seconds (starting a new generation may help), `503` when the AI
        provider refused the request in a way a retry will not fix (AI generation is unavailable
        until we fix it; the user can write the description manually). `404` when the generation
        or vacancy does not exist, including a generation older than 32 hours.
      responses:
        '200':
          description: Current generation status, `PENDING` or `COMPLETED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDescriptionGeneration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /vacancy/{id}:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    patch:
      operationId: updateVacancy
      tags: [Vacancy]
      summary: Partially update a vacancy
      description: >
        Partially updates a vacancy. A field present in the request body replaces the current
        value; a field omitted from the body, or set to `null`, is left untouched. Clearing a field
        is not supported. Any combination of the core fields, `description`, `contactPerson` and
        `offer` may be sent in a single request; the client sends whichever section(s) it currently
        has. A body without fields changes nothing and returns the vacancy as it is.


        An object (`location`, `description`, `contactPerson`, `offer`) is replaced as a whole, not
        merged field by field: a field left out of a section that is sent is cleared.
        `description` follows the rules of `POST /vacancy/{id}/description`. `minHoursPerWeek` and
        `maxHoursPerWeek` are sent together. `offer` must contain `salaryMin`, `salaryMax` or
        `numberOfHolidays`; `currency` and `salaryPeriod` are required as soon as a salary is
        present; and `salaryMin` must not be greater than `salaryMax`. A violation is a `400`
        naming the field.


        Status is never changed through this endpoint — use `POST /vacancy/{id}/transitions`
        instead, since each transition has its own legality rules and side effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyUpdateRequest'
      responses:
        '200':
          description: Updated vacancy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConcurrentModification'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getVacancy
      tags: [Vacancy]
      summary: Fetch a single vacancy
      responses:
        '200':
          description: The requested vacancy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteVacancy
      tags: [Vacancy]
      summary: Soft-delete a vacancy
      description: >
        Soft delete only — sets `status=ARCHIVED` and stamps `deletedAt`. Never performs a hard row
        delete, since a vacancy may have pipeline events attached that must remain traceable.
      responses:
        '204':
          description: Vacancy archived.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vacancy/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    post:
      operationId: transitionVacancy
      tags: [Vacancy]
      summary: Move a vacancy to its next status
      description: >
        Applies one status transition, named by `action`:


        - `PUBLISH`: `DRAFT` → `PUBLISHED`. The apply-flow for this vacancy goes live.

        - `FILL`: `PUBLISHED` → `FILLED`. The vacancy was filled.

        - `CLOSE`: `DRAFT` or `PUBLISHED` → `CLOSED`. The vacancy is cancelled or withdrawn
          without ever being filled.


        An action that is not legal from the vacancy's current status is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyTransitionRequest'
      responses:
        '200':
          description: The vacancy in its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Multi-tenancy (organization scoping) is derived from this token, never from the request or
        response body.

  parameters:
    VacancyId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VacancyId'
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GenerationId'
    JobTitleFilter:
      name: jobTitle
      in: query
      required: false
      description: Partial, case-insensitive match on job title (`ILIKE`-style).
      schema:
        type: string
    StatusFilter:
      name: status
      in: query
      required: false
      description: Filter by one or more statuses.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/VacancyStatus'
    CategoryFilter:
      name: category
      in: query
      required: false
      description: Filter by one or more categories.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/VacancyCategory'
    CreatedFrom:
      name: createdFrom
      in: query
      required: false
      description: Include vacancies created on or after this date.
      schema:
        type: string
        format: date
    CreatedTo:
      name: createdTo
      in: query
      required: false
      description: Include vacancies created on or before this date.
      schema:
        type: string
        format: date
    OpenDaysMin:
      name: openDaysMin
      in: query
      required: false
      description: >
        Minimum number of days the vacancy has been open, derived from `publishedAt` at query time
        (not a stored field).
      schema:
        type: integer
        minimum: 0
    OpenDaysMax:
      name: openDaysMax
      in: query
      required: false
      description: >
        Maximum number of days the vacancy has been open, derived from `publishedAt` at query time
        (not a stored field).
      schema:
        type: integer
        minimum: 0
    ContactPersonName:
      name: contactPersonName
      in: query
      required: false
      description: Free-text match on `contactPerson.name`.
      schema:
        type: string
    SortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt, jobTitle, openDays]
        default: createdAt
    SortDir:
      name: sortDir
      in: query
      required: false
      schema:
        type: string
        enum: [ASC, DESC]
        default: DESC
    Cursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque keyset-pagination cursor from a previous response's `nextCursor`. Omit to fetch the
        first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The authenticated user does not have the required authorization to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: No vacancy exists with the given id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: The requested status transition is not legal from the vacancy's current status.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConcurrentModification:
      description: >
        The vacancy was changed by someone else while this request was processed. Reload it and
        make the change again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableContent:
      description: >
        The request was well-formed, but its content cannot be processed; changing the input is
        needed before retrying.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: >
        The request body has a `Content-Type` this operation does not accept, or none at all. The
        `Accept` header lists the content types it does accept; send the body again with one of
        them. Nothing has changed.
      headers:
        Accept:
          description: The content types this operation accepts for its request body.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: An unexpected error occurred while processing the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: >
        A service the request depends on is unavailable; retrying right away will not help.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    VacancyId:
      type: string
      format: uuid
      readOnly: true

    GenerationId:
      type: string
      format: uuid
      readOnly: true

    VacancyDescriptionGenerationStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED]
      description: >
        `FAILED` is never returned in a `200` body: a failed generation is reported as a problem
        response by `GET /vacancy/{id}/generate-description/{generationId}`.

    Language:
      type: string
      description: ISO 639-1 language code of the vacancy texts, upper case like the country code.
      enum: [NL, EN, DE, FR]

    VacancyStatus:
      type: string
      enum: [DRAFT, PUBLISHED, FILLED, CLOSED, ARCHIVED]
      description: >
        `CLOSED` represents a vacancy cancelled or withdrawn without a hire. `ARCHIVED` is set by
        soft delete (`DELETE /vacancy/{id}`) and is never set directly by a client.

    VacancyCategory:
      type: string
      description: >
        Internal Talmar job-function taxonomy.
      enum:
        - ADMINISTRATION
        - CONSTRUCTION
        - CUSTOMER_SUPPORT
        - DESIGN_CREATIVE
        - EDUCATION
        - ENGINEERING
        - FACILITY_SERVICES
        - FINANCE
        - HEALTHCARE
        - HOSPITALITY
        - HUMAN_RESOURCES
        - LEGAL
        - LOGISTICS_SUPPLY_CHAIN
        - MANAGEMENT
        - MARKETING
        - OPERATIONS
        - PRODUCTION_MANUFACTURING
        - RETAIL
        - SALES
        - SCIENCE_RESEARCH
        - OTHER

    WorkplaceType:
      type: string
      enum: [ONSITE, REMOTE, HYBRID]

    SalaryPeriod:
      type: string
      enum: [HOURLY, MONTHLY, ANNUAL]

    Location:
      type: object
      required: [country, city]
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: '^[A-Z]{2}$'
        city:
          type: string
          maxLength: 200

    VacancyDescriptionResponse:
      type: object
      description: >
        All fields optional and populated incrementally. A draft from the separate, explicit
        AI-generation endpoint (`POST /vacancy/{id}/generate-description`) is shown to the user for
        editing and only then submitted via `POST /vacancy/{id}/description` — never generated
        synchronously inside that request.
      properties:
        summary:
          type: string
          maxLength: 1000
        jobDescription:
          type: string
          maxLength: 5000
        tasks:
          type: string
          maxLength: 5000
        whatWeOffer:
          type: string
          maxLength: 2500
        aboutUs:
          type: string
          maxLength: 2500

    ContactPerson:
      type: object
      description: >
        The person candidates can contact about the vacancy. `phone` is returned normalised: digits
        only, with a leading `+` for an international number (`+31 (0)6 12 34 56 78` becomes
        `+31612345678`, `0031 6-12345678` too).
      required: [name, email]
      properties:
        name:
          type: string
          description: Full name. Letters, spaces, apostrophes, dots and hyphens only.
          minLength: 2
          maxLength: 35
          pattern: '^(?=.*\p{L})[\p{L}\p{M}''’.-]+( [\p{L}\p{M}''’.-]+)*$'
        role:
          type: string
          description: Job title of the contact person, e.g. `Hiring manager`.
          maxLength: 50
          pattern: '^[\p{L}\p{M}\p{N} &/(),.''’+-]+$'
        phone:
          type: string
          description: >
            6 to 15 digits, optionally with a leading `+` and spaces, brackets, dots, slashes or
            hyphens between them.
          maxLength: 25
          pattern: '^\+?(?:[ ()./-]*[0-9]){6,15}[ ()./-]*$'
        email:
          type: string
          format: email
          maxLength: 75
      example:
        name: Sanne de Vries
        role: Hiring manager
        phone: +31 (0)6 12 34 56 78
        email: sanne.devries@acme.nl

    CurrencyCode:
      type: string
      description: >
        ISO 4217 code of a currency used in Europe: the EU (euro and the national currencies of
        member states outside the euro area), and the other European countries Talmar serves.
      enum: [EUR, CZK, DKK, HUF, PLN, RON, SEK, GBP, CHF, NOK, ISK, ALL, BAM, MKD, MDL, RSD, UAH]

    Offer:
      type: object
      description: >
        At least one of `salaryMin`, `salaryMax` and `numberOfHolidays` is present. `currency` and
        `salaryPeriod` are required as soon as either `salaryMin` or `salaryMax` is present, given
        the EU multi-country target market, and `salaryMin` is not greater than `salaryMax`. Not
        expressed in the schema (kept as a plain object for codegen compatibility); the API rejects
        a violation with `400`.
      properties:
        salaryMin:
          type: [number, 'null']
          description: >
            Gross salary in `currency` per `salaryPeriod`. Decimals are allowed; the amount is
            rounded half up to 2 decimals (`10.745` becomes `10.75`, `10.744` becomes `10.74`) and
            always returned with 2 decimals.
          minimum: 0
          maximum: 100000000
        salaryMax:
          type: [number, 'null']
          description: >
            Gross salary in `currency` per `salaryPeriod`. Decimals are allowed; the amount is
            rounded half up to 2 decimals (`10.745` becomes `10.75`, `10.744` becomes `10.74`) and
            always returned with 2 decimals.
          minimum: 0
          maximum: 100000000
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        salaryPeriod:
          $ref: '#/components/schemas/SalaryPeriod'
        numberOfHolidays:
          type: [number, 'null']
          description: >
            Full-time-equivalent holiday days. Never pre-computed/prorated server-side.
          minimum: 0
          maximum: 60
      example:
        salaryMin: 3800.75
        salaryMax: 4601.92
        currency: EUR
        salaryPeriod: MONTHLY
        numberOfHolidays: 25

    VacancyResponse:
      type: object
      required:
        - id
        - status
        - jobTitle
        - category
        - location
        - workplaceType
        - hoursPerWeek
        - language
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/VacancyId'
        status:
          $ref: '#/components/schemas/VacancyStatus'
        jobTitle:
          type: string
          maxLength: 200
        language:
          $ref: '#/components/schemas/Language'
        category:
          $ref: '#/components/schemas/VacancyCategory'
        location:
          $ref: '#/components/schemas/Location'
        workplaceType:
          $ref: '#/components/schemas/WorkplaceType'
        minHoursPerWeek:
          type: number
          description: Hours per week; decimals allowed for part-time roles (e.g. 32.5).
          exclusiveMinimum: 0
        maxHoursPerWeek:
          type: number
          description: Hours per week; decimals allowed for part-time roles (e.g. 32.5).
          exclusiveMinimum: 1
        description:
          $ref: '#/components/schemas/VacancyDescriptionResponse'
        contactPerson:
          $ref: '#/components/schemas/ContactPerson'
        offer:
          $ref: '#/components/schemas/Offer'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        publishedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
        deletedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Set together with `status=ARCHIVED` by soft delete.

    VacancyCoreRequest:
      type: object
      description: Minimum fields to create a vacancy in `DRAFT` status. No `id` — the resource is identified by the URL.
      required: [jobTitle, category, location, workplaceType, hoursPerWeek, minHoursPerWeek, maxHoursPerWeek, language]
      properties:
        jobTitle:
          type: string
          minLength: 2
          maxLength: 100
        language:
          $ref: '#/components/schemas/Language'
        category:
          $ref: '#/components/schemas/VacancyCategory'
        location:
          $ref: '#/components/schemas/Location'
        workplaceType:
          $ref: '#/components/schemas/WorkplaceType'
        minHoursPerWeek:
          type: number
          minimum: 0
          maximum: 60
        maxHoursPerWeek:
          type: number
          exclusiveMinimum: 1
          maximum: 60
    VacancyDescriptionRequest:
      allOf:
        - $ref: '#/components/schemas/VacancyDescriptionResponse'

    VacancyDescriptionGeneration:
      type: object
      description: >
        Status of an asynchronous description-generation job started via
        `POST /vacancy/{id}/generate-description`. `description` is populated only once `status`
        is `COMPLETED` and then carries only the generated fields (`summary`, `jobDescription`,
        `tasks`); it is absent while `PENDING`. A `FAILED` generation is returned as a problem
        response instead.
      required: [generationId, status]
      properties:
        generationId:
          $ref: '#/components/schemas/GenerationId'
        status:
          $ref: '#/components/schemas/VacancyDescriptionGenerationStatus'
        description:
          $ref: '#/components/schemas/VacancyDescriptionResponse'

    GenerateVacancyDescriptionRequest:
      type: object
      description: >
        Short inputs used to generate an AI-assisted `description` draft for an existing vacancy
        (`POST /vacancy/{id}/generate-description`). The result is a suggestion only, shown to the
        user for editing before being submitted via `POST /vacancy/{id}/description`. Raw HTML,
        script-like tags and control characters other than newline, carriage return and tab are
        rejected with `400`.
      required: [mostImportantTasks, team, whyNiceJob]
      properties:
        mostImportantTasks:
          type: string
          maxLength: 1000
          description: The most important day-to-day tasks for this role.
        team:
          type: string
          maxLength: 1000
          description: Description of the team the candidate will join.
        whyNiceJob:
          type: string
          maxLength: 1000
          description: Why this is a compelling job to candidates.

    VacancyTransitionAction:
      type: string
      enum: [PUBLISH, FILL, CLOSE]
      description: >
        The status transition to apply. `PUBLISH`: `DRAFT` → `PUBLISHED`. `FILL`: `PUBLISHED` →
        `FILLED`. `CLOSE`: `DRAFT` or `PUBLISHED` → `CLOSED`.

    VacancyTransitionRequest:
      type: object
      description: Body of `POST /vacancy/{id}/transitions`.
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/VacancyTransitionAction'
      example:
        action: PUBLISH

    VacancyUpdateRequest:
      type: object
      description: >
        Body for `PATCH /vacancy/{id}`. Every section is optional and independent — send only the
        section(s) you have; an omitted or `null` field is left untouched. No `id` field; the
        resource is identified by the URL path.
      properties:
        jobTitle:
          type: string
          maxLength: 200
        language:
          $ref: '#/components/schemas/Language'
        category:
          $ref: '#/components/schemas/VacancyCategory'
        location:
          $ref: '#/components/schemas/Location'
        workplaceType:
          $ref: '#/components/schemas/WorkplaceType'
        minHoursPerWeek:
          type: number
          description: Sent together with `maxHoursPerWeek`.
          minimum: 0
          maximum: 60
        maxHoursPerWeek:
          type: number
          description: Sent together with `minHoursPerWeek`.
          exclusiveMinimum: 1
          maximum: 60
        description:
          $ref: '#/components/schemas/VacancyDescriptionRequest'
        contactPerson:
          $ref: '#/components/schemas/ContactPerson'
        offer:
          $ref: '#/components/schemas/Offer'
      example:
        jobTitle: Senior Sales Manager
        workplaceType: HYBRID
        minHoursPerWeek: 32
        maxHoursPerWeek: 40
        offer:
          salaryMin: 4200
          salaryMax: 5000
          currency: EUR
          salaryPeriod: MONTHLY
          numberOfHolidays: 25

    VacancyListResponse:
      type: object
      required: [items, totalVacancies, vacanciesMatchingCriteria, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VacancyResponse'
        totalVacancies:
          type: integer
        vacanciesMatchingCriteria:
          type: integer
        nextCursor:
          type: [string, 'null']
          description: >
            Opaque cursor for the next page, to be echoed back via the `cursor` query parameter.
            `null` when this is the last page.



    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          description: Extension member listing field-level validation failures, when applicable.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
